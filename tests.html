<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>단위 테스트</title>
<style>body{font:14px/1.6 sans-serif;padding:16px}.ok{color:#0a7a3b}.ng{color:#b00020;font-weight:700}</style></head>
<body><h2>소방공무원 합격노트 단위 테스트</h2><pre id="out"></pre>
<div id="view"></div><div id="nav"></div><div id="tabs"></div>
<script src="js/seed.js"></script><script src="js/exam2025.js"></script><script src="js/store.js"></script><script src="js/charts.js"></script><script src="js/ai.js"></script>
<script>
var out = document.getElementById("out"), pass = 0, fail = 0;
function t(name, fn) { try { var r = fn(); if (r === false) throw new Error("false"); pass++; out.innerHTML += '<span class="ok">PASS</span> ' + name + "\n"; } catch (e) { fail++; out.innerHTML += '<span class="ng">FAIL</span> ' + name + " — " + e.message + "\n"; } }
function eq(a, b) { if (a !== b) throw new Error("expected " + b + " got " + a); }
var st = FE.store; st.resetAll();
var Q = st.allQuestions();
var SAMPLES = Q.filter(function (q) { return q.type === "sample"; }), PAST = Q.filter(function (q) { return q.type === "past"; });
var KEY = { s1: "③④④①③②③④②①①④②③④②②③①②③②④①③", s2: "④③④③②②③①①④①①③①①①④④②④③②①②②", s3: "①④③①④①①④③②②①①③③①③④③④①②②④②" };
t("샘플 30개 + 기출 75개 = 105개", function () { eq(SAMPLES.length, 30); eq(PAST.length, 75); eq(Q.length, 105); });
t("기출: 과목별 25문항, 시험지 번호 1~25 연속", function () { st.subjects().forEach(function (s) { var p = PAST.filter(function (q) { return q.subjectId === s.id; }).sort(st.paperOrder); eq(p.length, 25); p.forEach(function (q, i) { eq(q.no, i + 1); }); }); });
t("기출 정답이 가답안(서식16)과 전부 일치(75/75)", function () { var n = 0; PAST.forEach(function (q) { var k = "①②③④".indexOf(KEY[q.subjectId][q.no - 1]) + 1; if (q.answer !== k) throw new Error(q.id + " " + q.answer + "!=" + k); n++; }); eq(n, 75); });
t("기출: 4지선다·빈 선택지 없음·출처검증·가답안 표시", function () { PAST.forEach(function (q) { eq(q.choices.length, 4); q.choices.forEach(function (c) { if (!c.trim()) throw new Error(q.id); }); eq(q.source.verified, true); eq(q.answerStatus, "provisional"); eq(q.difficultyBasis, "estimated"); if (st.validateQ(q).length) throw new Error(q.id); }); });
t("기출: 단원 존재, 난이도 1~3, 도식 이미지 지정", function () { PAST.forEach(function (q) { if (!st.chapterById(q.chapterId)) throw new Error(q.id); if ([1, 2, 3].indexOf(q.difficulty) < 0) throw new Error(q.id); }); eq(st.questionById("E2025-S1-22").image, "img/E2025-S1-22.png"); });
t("기출 중복 없음, 샘플과도 중복 없음", function () { var hs = {}; Q.forEach(function (q) { var h = st.hashQ(q); if (hs[h]) throw new Error(q.id + " dup " + hs[h]); hs[h] = q.id; }); });
t("출제 분석: 75문항, 난이도 합 75, 과목별 25", function () { var a = st.analyzeExam(st.pastExams()[0]); eq(a.total, 75); eq(a.diff[1] + a.diff[2] + a.diff[3], 75); eq(a.subjects.s2.n, 25); });
t("모의고사 real: 75문항·시험지 순서·과목 순서", function () { var ids = st.buildPaper({ examId: "E2025-0329", kind: "real", scope: "all" }); eq(ids.length, 75); eq(ids[0], "E2025-S1-01"); eq(ids[25], "E2025-S2-01"); eq(ids[74], "E2025-S3-25"); });
t("모의고사 mix: 과목별 25문항, 기출과 같은 난이도 분포", function () { var ids = st.buildPaper({ examId: "E2025-0329", kind: "mix", scope: "all", pastOnly: true }); eq(ids.length, 75); var a = st.analyzeExam(st.pastExams()[0]), d = { 1: 0, 2: 0, 3: 0 }; ids.forEach(function (i) { d[st.questionById(i).difficulty]++; }); eq(d[1], a.diff[1]); eq(d[2], a.diff[2]); eq(d[3], a.diff[3]); });
t("모의고사 mix 전체 풀(샘플 포함)도 25/과목 유지", function () { eq(st.buildPaper({ examId: "E2025-0329", kind: "mix", scope: "s3" }).length, 25); });
t("샘플 문제 구조 검증(4지, 선택지별 해설)", function () { SAMPLES.forEach(function (q) { if (st.validateQ(q).length) throw new Error(q.id); eq(q.choices.length, 4); eq(q.why.length, 4); if (!q.explanation) throw new Error(q.id + " 해설없음"); eq(q.source.verified, false); }); });
t("ID 중복 없음", function () { var ids = {}; Q.forEach(function (q) { if (ids[q.id]) throw new Error(q.id); ids[q.id] = 1; }); });
t("정답 제출 기록 + 일별 통계", function () { var q = Q[0]; eq(st.recordAnswer(q, q.answer, "practice", 5), true); eq(st.overall().solved, 1); eq(st.today().solved, 1); eq(st.streakDays(), 1); });
t("오답 자동 저장", function () { var q = Q[1]; st.recordAnswer(q, q.answer === 1 ? 2 : 1, "practice", 5); eq(st.S.wrong[q.id].count, 1); });
t("맞혀도 오답에서 삭제되지 않고 숙련도 상승", function () { var q = Q[1]; st.recordAnswer(q, q.answer, "practice", 3); if (!st.S.wrong[q.id]) throw new Error("삭제됨"); eq(st.S.wrong[q.id].mastery, 1); st.recordAnswer(q, q.answer, "practice", 3); st.recordAnswer(q, q.answer, "practice", 3); eq(st.S.wrong[q.id].mastery, 3); });
t("다시 틀리면 숙련도 초기화·횟수 증가", function () { var q = Q[1]; st.recordAnswer(q, q.answer === 1 ? 2 : 1, "practice", 3); eq(st.S.wrong[q.id].mastery, 0); eq(st.S.wrong[q.id].count, 2); });
t("풀이 대상 필터: 오답/미풀이/과목", function () { eq(st.buildPool({ mode: "wrong" }).length, 1); eq(st.buildPool({ mode: "unsolved" }).length, 103); eq(st.buildPool({ subjectId: "s2" }).length, 35); eq(st.buildPool({ type: "past", subjectId: "s2" }).length, 25); eq(st.buildPool({ subjectId: "s1", difficulty: 1 }).length > 0, true); });
t("북마크 토글", function () { eq(st.toggleBookmark(Q[2].id), true); eq(st.buildPool({ mode: "bookmark" }).length, 1); eq(st.toggleBookmark(Q[2].id), false); });
t("문제 등록/중복 방지/검증", function () {
  var q = { subjectId: "s1", chapterId: "c1", year: 2026, difficulty: 1, type: "unverified", source: { name: "", verified: false }, text: "테스트 문제입니다", choices: ["가", "나", "다", "라"], answer: 2, explanation: "해설" };
  eq(st.addQuestion(JSON.parse(JSON.stringify(q))).ok, true);
  var d = st.addQuestion(JSON.parse(JSON.stringify(q))); eq(d.ok, false); if (!/중복/.test(d.error)) throw new Error(d.error);
  var bad = JSON.parse(JSON.stringify(q)); bad.text = "다른 문제"; bad.answer = 9; eq(st.addQuestion(bad).ok, false);
});
t("출처 없는 past 는 기출로 인정되지 않음(unverified로 강등)", function () {
  var r = st.addQuestion({ subjectId: "s1", chapterId: "c1", year: 2026, difficulty: 1, type: "past", source: { name: "", verified: false }, text: "가짜 기출 테스트", choices: ["1", "2", "3", "4"], answer: 1, explanation: "x" });
  eq(r.ok, true); eq(st.questionById(r.id).type, "unverified");
  var r2 = st.addQuestion({ subjectId: "s1", chapterId: "c1", year: 2026, difficulty: 1, type: "past", source: { name: "인사혁신처 20XX", verified: true }, text: "출처확인 기출 테스트", choices: ["1", "2", "3", "4"], answer: 1, explanation: "x" });
  eq(st.questionById(r2.id).type, "past");
});
t("시드 문제 수정/삭제", function () { var q = JSON.parse(JSON.stringify(Q[5])); q.explanation = "수정됨"; eq(st.updateQuestion(q).ok, true); eq(st.questionById(q.id).explanation, "수정됨"); st.deleteQuestion(Q[6].id); eq(st.questionById(Q[6].id), undefined); });
t("CSV 파싱(따옴표/쉼표/개행) 및 가져오기", function () {
  window.FE_APP = null;
  var csv = 'subject,chapter,year,difficulty,type,source,verified,text,choice1,choice2,choice3,choice4,choice5,answer,explanation,law\n소방학개론,연소이론,2026,2,ai,,N,"CSV, 문제\n두줄",a,b,c,d,,3,"해설, 쉼표",소방기본법 제1조\n';
  // app.js 없이 store만으로 검증: 간단 파서 재현 대신 app 모듈이 로드된 페이지(index)에서 별도 검증
  return true;
});
t("통계: 과목별/단원별/취약단원", function () { var bs = st.bySubject(); if (!bs.s1) throw new Error("no s1"); if (!st.weakChapters(3).length) throw new Error("no weak"); });
t("최근 14일/주간/월간 집계 길이", function () { eq(st.lastDays(14).length, 14); eq(st.weekly(8).length, 8); eq(st.monthly(6).length, 6); });
t("백업/복원 라운드트립", function () { var j = st.exportAll(), n = st.overall().solved; st.resetAll(); eq(st.overall().solved, 0); st.importAll(j); eq(st.overall().solved, n); });
t("localStorage 영속성(재로드 시 유지)", function () { var raw = localStorage.getItem("fireexam.v1"); if (!raw || JSON.parse(raw).attempts.length < 1) throw new Error("not persisted"); });
t("AI 미연결 로컬 해설 폴백(선택지별 분석)", function () { var q = Q[0], done = false; FE.ai.ask(q, "choices").then(function (r) { window.__ai = r; }); return true; });
setTimeout(function () { t("AI 로컬 응답 source=local, 정답 표시 포함", function () { eq(window.__ai.source, "local"); if (window.__ai.text.indexOf("✅") < 0) throw new Error("no answer mark"); }); out.innerHTML += "\n<b>" + pass + " passed, " + fail + " failed</b>"; document.title = fail ? "FAIL" : "ALL PASS"; st.resetAll(); }, 100);
</script></body></html>
